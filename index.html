<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Me and Aadu on Netflix</title>
    <link rel="icon" href="https://assets.nflxext.com/us/ffe/siteui/common/icons/nficon2016.ico">
    <style>
        body { margin: 0; padding: 0; background-color: #141414; color: white; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; overflow: hidden; }
        
        /* PASSWORD SCREEN */
        #password-screen { display: flex; align-items: center; justify-content: center; height: 100vh; width: 100vw; background-color: rgba(0, 0, 0, 0.9); background-image: linear-gradient(to top, rgba(0, 0, 0, 0.8) 0, rgba(0, 0, 0, 0) 60%, rgba(0, 0, 0, 0.8) 100%); position: fixed; top: 0; left: 0; z-index: 2000; }
        .password-container { background-color: rgba(0, 0, 0, 0.75); padding: 60px 68px 40px; border-radius: 4px; display: flex; flex-direction: column; width: 100%; max-width: 314px; }
        .password-container .logo { color: #E50914; font-size: 2.5rem; font-weight: bold; margin: 0 0 20px 0; text-align: center; }
        .password-container h2 { margin: 0 0 10px 0; font-size: 2rem; font-weight: bold; }
        .password-container p { color: #8c8c8c; margin-bottom: 20px; font-size: 1rem; }
        .password-container input { background: #333; border: none; border-radius: 4px; padding: 16px 20px; color: white; font-size: 1rem; margin-bottom: 20px; outline: none; }
        .password-container button { background: #E50914; color: white; border: none; border-radius: 4px; padding: 16px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s ease; }
        .password-container button:hover { background: #f40612; }
        #password-error { color: #E50914; margin-top: 15px; font-size: 0.9rem; display: none; }

        /* INTRO SCREEN */
        #intro-screen { display: none; align-items: center; justify-content: center; width: 100%; height: 100vh; background-color: #000; position: fixed; top: 0; left: 0; z-index: 1000; }
        #intro-video { width: 100vw; height: 100vh; border: none; pointer-events: none; transform: scale(1.3); }
    </style>
</head>
<body>

    <div id="password-screen">
        <div class="password-container">
            <h1 class="logo">NETFLIX</h1>
            <h2>Welcome Back</h2>
            <p>Please enter the password to view this site.</p>
            <input type="password" id="site-password-input" placeholder="Password">
            <button onclick="checkPassword()">Sign In</button>
            <div id="password-error">Incorrect password. Please try again.</div>
        </div>
    </div>

    <div id="intro-screen">
        <iframe id="intro-video" src="" allow="autoplay; encrypted-media"></iframe>
    </div>

    <script>
        const sitePassword = "ourmovienight"; 

        function checkPassword() {
            const input = document.getElementById('site-password-input').value;
            if (input === sitePassword) {
                // Save login state so other pages know we are allowed in
                sessionStorage.setItem('authenticated', 'true');
                document.getElementById('password-screen').style.display = 'none';
                startIntro(); 
            } else {
                document.getElementById('password-error').style.display = 'block';
            }
        }

        document.getElementById('site-password-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkPassword();
        });

        function startIntro() {
            const introScreen = document.getElementById('intro-screen');
            const introVideo = document.getElementById('intro-video');
            
            introScreen.style.display = 'flex';
            introVideo.src = "https://www.youtube.com/embed/GV3HUDMQ-F8?autoplay=1&mute=1&controls=0&disablekb=1&fs=0&modestbranding=1&rel=0&iv_load_policy=3&playsinline=1";

            // After 4.5 seconds, redirect to the profiles page
            setTimeout(() => {
                window.location.href = 'profiles.html';
            }, 4500);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profiles - Me and Aadu on Netflix</title>
    <link rel="icon" href="https://assets.nflxext.com/us/ffe/siteui/common/icons/nficon2016.ico">
    <style>
        body { margin: 0; padding: 0; background-color: #141414; color: white; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; overflow: hidden; }
        h1 { font-weight: normal; }

        #profile-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        #profile-screen h1 { font-size: 3rem; margin-bottom: 2rem; }
        .profiles-container { display: flex; gap: 2rem; }
        .profile { cursor: pointer; transition: transform 0.2s ease; opacity: 0; animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        .profile:hover { transform: scale(1.1); }
        .profile-img { width: 150px; height: 150px; border-radius: 4px; object-fit: cover; border: 2px solid transparent; }
        .profile:hover .profile-img { border: 2px solid white; }
        .profile-name { margin-top: 10px; color: #808080; font-size: 1.2rem; }
        .profile:hover .profile-name { color: white; }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 0.8; }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div id="profile-screen">
        <h1>Who's watching?</h1>
        <div class="profiles-container">
            <div class="profile" onclick="selectProfile('Sonu')" style="animation-delay: 0.1s;">
                <img class="profile-img" src="https://wallpapers.com/images/hd/netflix-profile-pictures-1000-x-1000-qo9h82134t9nv0j0.jpg" alt="Sonu">
                <div class="profile-name">Sonu</div>
            </div>
            <div class="profile" onclick="selectProfile('Aadu')" style="animation-delay: 0.2s;">
                <img class="profile-img" src="https://wallpapers.com/images/hd/netflix-profile-pictures-1000-x-1000-88wkdmjrorckekha.jpg" alt="Aadu">
                <div class="profile-name">Aadu</div>
            </div>
            <div class="profile" onclick="selectProfile('US')" style="animation-delay: 0.3s;">
                <img class="profile-img" src="https://wallpapers.com/images/hd/netflix-profile-pictures-1000-x-1000-88wkdmjrorckekha.jpg" alt="US">
                <div class="profile-name">US</div>
            </div>
        </div>
    </div>

    <script>
        // Security check: If they didn't log in, send them back to index.html
        if (sessionStorage.getItem('authenticated') !== 'true') {
            window.location.href = 'index.html';
        }

        function selectProfile(username) {
            // Save which profile was clicked
            localStorage.setItem('currentUser', username);
            // Go to the dashboard
            window.location.href = 'browse.html';
        }
    </script>
</body>
</html>
